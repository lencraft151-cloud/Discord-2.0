<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord 2.0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Anmeldung -->
    <section id="auth" class="auth" hidden>
      <form id="auth-form" class="auth-card">
        <h1>Willkommen bei Discord 2.0</h1>
        <p class="muted" id="auth-subtitle">Melde dich an, um weiterzuchatten.</p>
        <label>Benutzername <input name="username" autocomplete="username" required minlength="2" maxlength="32" /></label>
        <label>Passwort <input name="password" type="password" autocomplete="current-password" required minlength="6" /></label>
        <p class="error" id="auth-error" hidden></p>
        <button type="submit" class="primary" id="auth-submit">Anmelden</button>
        <p class="muted small">
          <span id="auth-switch-text">Noch kein Konto?</span>
          <button type="button" class="link" id="auth-switch">Registrieren</button>
        </p>
      </form>
    </section>

    <!-- Hauptansicht -->
    <div id="app" class="app" hidden>
      <nav class="rail" aria-label="Server">
        <button class="rail-item home" id="home-button" title="Direktnachrichten">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 3C7 3 3 6.6 3 11c0 2.4 1.2 4.6 3.1 6.1L5 21l4.3-2.2c.9.2 1.8.3 2.7.3 5 0 9-3.6 9-8s-4-8.1-9-8.1Z"/></svg>
        </button>
        <div class="rail-separator"></div>
        <div id="server-list" class="server-list"></div>
        <button class="rail-item action" id="add-server-button" title="Server erstellen oder beitreten">+</button>
        <button class="rail-item action" id="discover-button" title="Discord-Server entdecken">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.6 6.4-2 5.2-5.2 2 2-5.2 5.2-2ZM12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></svg>
        </button>
      </nav>

      <aside class="sidebar" id="sidebar">
        <header class="sidebar-header">
          <span id="sidebar-title">Direktnachrichten</span>
          <button class="icon-button" id="sidebar-action" title="Neue Nachricht">+</button>
        </header>
        <div class="sidebar-body" id="sidebar-list"></div>
        <footer class="user-panel">
          <span class="avatar" id="me-avatar"></span>
          <span class="user-panel-name" id="me-name"></span>
          <button class="icon-button" id="logout-button" title="Abmelden">⏻</button>
        </footer>
      </aside>

      <main class="chat">
        <header class="chat-header">
          <button class="icon-button mobile-only" id="menu-button" title="Menü">☰</button>
          <span class="chat-title" id="chat-title"></span>
          <span class="badge discord" id="chat-bridged" hidden>über Discord</span>
          <span class="spacer"></span>
          <button class="icon-button" id="members-toggle" title="Mitgliederliste" hidden>👥</button>
        </header>
        <div class="messages" id="messages">
          <div class="empty" id="empty-state">
            <h2>Hi! 👋</h2>
            <p>Wähle links einen Kanal oder eine Direktnachricht.</p>
            <p class="muted">Über den Kompass unten links findest du Discord-Server, denen du beitreten kannst.</p>
          </div>
        </div>
        <div class="typing" id="typing"></div>
        <form class="composer" id="composer" hidden>
          <textarea id="composer-input" rows="1" maxlength="2000" placeholder="Nachricht senden"></textarea>
        </form>
      </main>

      <aside class="members" id="members" hidden></aside>
    </div>

    <!-- Dialog -->
    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <button class="icon-button modal-close" id="modal-close" title="Schließen">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
